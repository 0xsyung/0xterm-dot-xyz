<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>0xterm</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var rest = location.pathname.replace(/^\/app\/?/, "/") || "/";
        if (rest.charAt(0) !== "/") rest = "/" + rest;
        location.replace(
          "https://app.0xterm.xyz" + rest + location.search + location.hash
        );
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p>
        <a href="https://app.0xterm.xyz/">Continue to 0xterm</a>
      </p>
    </noscript>
  </body>
</html>
